version: '3.8'

services:
  # Optional — AI-05 Phase-3 Human Parsing model catalog / CCFR Phase-2 Appearance
  # Re-ID (Proposed). Not required unless QDRANT_ENABLED=true in server/.env.
  # See docs/design/Design_AI_AppearanceReID.md §12.
  qdrant:
    image: qdrant/qdrant:v1.18.2-unprivileged
    container_name: lts-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./server/storage/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/6333 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bgutil-pot-provider:
    # opt-in — server/.env의 YTDLP_POT_PROVIDER_ENABLED=true 없이는 서버가 호출하지
    # 않음 (qdrant와 동일한 opt-in 패턴). docs/design/Design_YouTube_RTSP_Ingest.md §12.6
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: lts-bgutil-pot-provider
    ports:
      - "4416:4416"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/4416 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: lts-mediamtx
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  server:
    build: ./server
    network_mode: host
    ports:
      - "3080:3080"
    env_file: ./server/.env
    volumes:
      - ./server/models:/app/models:ro
      - ./server/storage:/app/storage
    depends_on:
      - mediamtx
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
    restart: unless-stopped
